site_name: Sovereign Trust Framework
site_url: https://sovereigntrustframework.org
site_description: A framework for decentralized trust and self-sovereign identity
site_author: Alexandre Cardoso (wwww.cardosoalexandre.com)


repo_url: https://github.com/cardosoalexandrecom/sovereigntrustframework
repo_name: cardosoalexandrecom/sovereigntrustframework

theme:
  name: material
  logo: img/STF_logo_nobg.png
  favicon: img/STF_logo_nobg.png
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - toc:
      permalink: true  

extra_css:
  - style/custom.css

nav:
  - Home: index.md
  - Architecture: architecture.md
  - References: references.md
  - Core Modules:
      - STFX Crypto: stfx-crypto.md
      - STFX Runtime: stfx-runtime.md
      - STFX Transport: stfx-transport.md
  - Identity:
      - VID Implementation: VID-IMPLEMENTATION-ANALYSIS.md
  - Design Documentation:
      - Crypto API Analysis: stfx-crypto-api-analysis.md
      - Crypto Design Summary: STFX-CRYPTO-DESIGN-SUMMARY.md
      - Crypto Implementation Layers: stfx-crypto-implementation-layers.md
      - Crypto Visual Summary: STFX-CRYPTO-VISUAL-SUMMARY.md
      - Crypto Documentation Index: STFX-CRYPTO-DOCUMENTATION-INDEX.md
      - Runtime Decision Analysis: stfx-runtime_decision_analysis.md
      - Resolution Over Modularization: 00-RESOLUTION-OVER-MODULARIZATION.md
  - Architectural Principles:
      - Overview: architecural_principles.md
      - DIP & SOLID: arch_DIP_SOLID.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cardosoalexandrecom
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/alexandrecardoso
  generator: false  # Remove "Made with Material for MkDocs"
